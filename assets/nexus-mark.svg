<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" role="img" aria-labelledby="title desc">
  <title id="title">Nexus Launcher</title>
  <desc id="desc">An original violet geometric Nexus mark beside the Nexus Launcher wordmark.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131c"/>
      <stop offset="1" stop-color="#1b2131"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a69dff"/>
      <stop offset="1" stop-color="#6958e8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="880" height="240" rx="42" fill="url(#background)"/>
  <g transform="translate(52 40)">
    <path d="M80 0 149.3 40v80L80 160 10.7 120V40Z" fill="#252d43" stroke="#475675" stroke-width="3"/>
    <path d="M80 22 130.2 51v58L80 138 29.8 109V51Z" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M50 108 110 52M50 52l60 56" fill="none" stroke="#f4f2ff" stroke-width="8" stroke-linecap="round"/>
    <circle cx="50" cy="52" r="10" fill="#f4f2ff"/>
    <circle cx="110" cy="52" r="10" fill="#f4f2ff"/>
    <circle cx="50" cy="108" r="10" fill="#f4f2ff"/>
    <circle cx="110" cy="108" r="10" fill="#f4f2ff"/>
  </g>
  <g fill="#f7f9fc" font-family="Segoe UI Variable Display, Segoe UI, sans-serif">
    <text x="250" y="112" font-size="72" font-weight="700" letter-spacing="-2">Nexus</text>
    <text x="254" y="158" fill="#aeb8ce" font-size="27" font-weight="500" letter-spacing="8">LAUNCHER</text>
  </g>
</svg>
