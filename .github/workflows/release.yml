name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify release tag
        shell: pwsh
        run: |
          $tagRef = "refs/tags/$env:RELEASE_TAG"
          git show-ref --verify --quiet $tagRef
          if ($LASTEXITCODE -ne 0) {
            throw "Release workflow requires an existing annotated or lightweight tag: $env:RELEASE_TAG"
          }
          $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
          $headCommit = git rev-parse HEAD
          if ($tagCommit -ne $headCommit) {
            throw "Checked-out commit does not match release tag $env:RELEASE_TAG."
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build release artifacts
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          ./scripts/Package.ps1 -Configuration Release -Version $version -RequireInstaller
          ./scripts/Verify-Release.ps1 -ArtifactsDirectory artifacts

      - name: Upload release artifacts for this run
        uses: actions/upload-artifact@v7
        with:
          name: NexusLauncher-${{ env.RELEASE_TAG }}
          path: |
            artifacts/NexusLauncher-Setup-x64.exe
            artifacts/NexusLauncher-portable-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG artifacts/NexusLauncher-Setup-x64.exe artifacts/NexusLauncher-portable-x64.zip artifacts/SHA256SUMS.txt
          }
          else {
            $releaseNotes = @(
              "## What's included",
              '',
              '- Local-first game and application library for Windows.',
              '- Steam, Windows Registry, Start menu, and user-selected-folder discovery.',
              '- Manual executable additions, safe launch handoff, favorites, local removal, WinGet search/install handoff, local backup, and safe ZIP mod import.',
              '- Self-contained x64 installer and portable ZIP with SHA-256 checksums.',
              '',
              '## Notes',
              '',
              'This is an early prerelease. The portable ZIP keeps its data beside the extracted app; the installer uses the normal per-user local data directory. No account, telemetry, cloud sync, online metadata, or AI integration is included. The binaries are unsigned.',
              '',
              'See the README and changelog for supported scope and limitations.'
            ) -join "`n"
            $arguments = @(
              'release', 'create', $env:RELEASE_TAG,
              'artifacts/NexusLauncher-Setup-x64.exe',
              'artifacts/NexusLauncher-portable-x64.zip',
              'artifacts/SHA256SUMS.txt',
              '--notes', $releaseNotes,
              '--title', "Nexus Launcher $env:RELEASE_TAG"
            )
            # v0.1.0 is intentionally the project's first public prerelease;
            # subsequent prerelease tags continue to use normal SemVer suffixes.
            if ($env:RELEASE_TAG -eq 'v0.1.0' -or $env:RELEASE_TAG -match '-') {
              $arguments += '--prerelease'
            }
            & gh @arguments
          }
